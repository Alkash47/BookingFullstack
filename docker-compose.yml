version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking
      SECRET_KEY: super-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
